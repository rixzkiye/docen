[package]
name = "docen-shaping"
version = "0.1.0"
edition = "2021"
authors = ["Demo Macro <abc@imst.xyz>"]
description = "WebAssembly text shaping & fontations engine for docen"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustybuzz = { version = "0.20.1", default-features = false }
read-fonts = { version = "0.44.0", default-features = false }
skrifa = { version = "0.47.0", default-features = false, features = ["libm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
